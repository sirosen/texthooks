name: build
on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os:
          - name: Windows
            runner: windows-latest
          - name: macOS
            runner: macos-latest
          - name: Linux
            runner: ubuntu-latest
        py: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        toxenv:
          - name: "test"
            value: "test-py"
        include:
          - os:
              name: Linux
              runner: ubuntu-latest
            py: '3.15'
            toxenv:
              name: "mypy"
              value: "mypy"
          - os:
              name: Linux
              runner: ubuntu-latest
            py: '3.15'
            toxenv:
              name: "check-package-build"
              value: "twine-check"
    name: "${{ matrix.toxenv.name }} (${{ matrix.os.name }}, py${{ matrix.py }})"
    runs-on: ${{ matrix.os.runner }}
    steps:
      - parallel:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
        - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
          with:
            python-version: ${{ matrix.py }}
        - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv tool install tox tox-uv
      - name: cache tox virtualenvs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tox
          key: >
            toxenv=${{ matrix.toxenv.value }}
            os=${{ runner.os }}
            python=${{ steps.setup-python.outputs.python-version }}
            hash=${{ hashFiles('.github/workflows/build.yaml', 'pyproject.toml', 'tox.ini') }}
      - run: tox run -e "${{ matrix.toxenv.value }}"
