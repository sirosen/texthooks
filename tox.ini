[tox]
envlist =
    mypy
    cov-clean
    test-py{3.15,3.14,3.13,3.12,3.11,3.10}
    cov-report
skip_missing_interpreters = true

[testenv:test]
description = "run tests"
dependency_groups = test
commands = coverage run -m pytest {posargs}
depends = cov-clean

[testenv:test-py{3.15,3.14,3.13,3.12,3.11,3.10}]
base = test

[testenv:cov-clean]
description = "cleanup coverage data"
dependency_groups = coverage
skip_install = true
commands = coverage erase

[testenv:cov-report]
description = "combine and report coverage results"
dependency_groups = coverage
skip_install = true
commands =
    -coverage combine
    coverage report --skip-covered
depends = test-py{3.15,3.14,3.13,3.12,3.11,3.10}

[testenv:mypy]
description = "run mypy type checking"
dependency_groups = typing
commands = mypy src/

[testenv:twine-check]
description = "check metadata with twine"
skip_install = true
dependency_groups = publish
allowlist_externals = rm
commands_pre = rm -rf dist/
# check that twine validating package data works
commands = python -m build
           twine check dist/*

[testenv:publish-release]
description = "publish a release"
skip_install = true
dependency_groups = publish
# clean the build dir before rebuilding
allowlist_externals = rm
commands_pre = rm -rf dist/
commands = python -m build
           twine upload dist/*
